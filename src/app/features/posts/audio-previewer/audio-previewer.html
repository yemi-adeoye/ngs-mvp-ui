<div class="audio-previewer-container d-flex flex-column flex-grow-1 bordered rounded">
  <div class="d-flex mb-1 p-0">
    <button class="btn control-icon delete ms-auto" (click)="handleDelete()">
      <i class="bi bi-x"></i>
    </button>
  </div>

  <div class="idle d-flex flex-column justify-content-center align-items-center">
    Visualization goes here
  </div>

  <div class="controls d-flex align-items-center mt-auto gap-2 small">
    <button class="btn btn-link p-0 control-icon ms-1" (click)="handlePlayback()">
      @if (playbackState() == 'IDLE' || playbackState() == 'PAUSED') {
        <i class="bi bi-play-fill"></i>
      }
      @if (playbackState() == 'PLAYING') {
        <i class="bi bi-pause-fill"></i>
      }
      @if (playbackState() == 'PLAYED') {
        <i class="bi bi-arrow-counterclockwise"></i>
      }
    </button>

    <div class="progress flex-grow-1">
      <div
        class="progress-bar progress-bar-animated"
        role="progressbar"
        [style.width.%]="playbackPercent()"
        [aria-valuenow]="audioCurrentTime()"
        [aria-valuemin]="0"
        [aria-valuemax]="100"
      ></div>
    </div>
    <span class="time">
      <span> {{ formatTime(audioCurrentTime()) }}</span
      >/
      <span>{{ formatTime(audioDuration) }}</span>
    </span>
    <button class="btn btn-link p-0 me-1 control-icon" (click)="handleMute()">
      @if (isMuted()) {
        <i class="bi bi-volume-mute-fill"></i>
      } @else {
        <i class="bi bi-volume-up-fill"></i>
      }
    </button>
  </div>
</div>
<audio
  #audioPlayer
  (timeupdate)="handleAudioPlayerTimeUpdate()"
  [src]="audioUrl"
  (ended)="handlePlayEnded()"
></audio>
