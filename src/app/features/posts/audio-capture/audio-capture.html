<div class="modal fade show d-block" tabindex="-1" role="dialog" id="mediaPicker">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header d-flex">
        <h5 class="modal-title">Record an Audio</h5>

        <button
          type="button"
          class="btn-close ms-auto"
          aria-label="Close"
          (click)="handleCloseButtonClick()"
        ></button>
      </div>

      <div class="modal-body">
        <div class="audio-previewer-container d-flex flex-column border rounded">
          <div
            class="idle d-flex flex-column flex-grow-1 justify-content-center align-items-center"
          >
            <button
              class="btn btn-primary"
              #recordButton
              type="button"
              (click)="handleRecordButtonClick()"
            >
              @if (controlState() == 'RECORDING' || controlState() == 'PLAYING') {
                <i
                  class="bi bi-circle-fill recording-dot"
                  [class.text-danger]="controlState() === 'RECORDING'"
                  [class.text-dark]="controlState() === 'PLAYING'"
                  [class.is-recording]="controlState() === 'RECORDING'"
                >
                </i>
              } @else if (controlState() == 'RECORDED' || controlState() == 'PLAYED') {
                Retake
              } @else {
                Record
              }
            </button>
            @if (controlState() == 'IDLE' || controlState() == 'RECORDED') {
              <span class="d-block mt-3 small"> Max length: 60s</span>
            }
            @if (controlState() == 'RECORDING') {
              <span class="d-block mt-3 small"> Time left: {{ recordingDuration() }}</span>
            }
          </div>

          <div class="controls d-flex align-items-center mt-auto border-top gap-2 small">
            <button
              class="btn btn-link p-0 control-icon ms-1"
              [disabled]="canDisablePlayback"
              (click)="handlePlayback()"
            >
              @if (playbackState() == 'IDLE' || playbackState() == 'PAUSED') {
                <i class="bi bi-play-fill" [class.text-gray]="controlState() == 'canPlay'"></i>
              }
              @if (playbackState() == 'PLAYING') {
                <i class="bi bi-pause-fill" [class.text-gray]="controlState() == 'canPlay'"></i>
              }
              @if (playbackState() == 'PLAYED') {
                <i
                  class="bi bi-arrow-counterclockwise"
                  [class.text-gray]="controlState() == 'canPlay'"
                ></i>
              }
            </button>

            <div class="progress flex-grow-1">
              <div
                class="progress-bar progress-bar-animated"
                role="progressbar"
                [style.width.%]="playbackPercent()"
                [aria-valuenow]="audioCurrentTime()"
                [aria-valuemin]="0"
                [aria-valuemax]="100"
              ></div>
            </div>
            <span class="time">
              <span> {{ formatTime(audioCurrentTime()) }}</span
              >/
              <span>{{ formatTime(audioDuration()) }}</span>
            </span>
            <button class="btn btn-link p-0 me-1 control-icon" (click)="handleMute()">
              @if (isMuted()) {
                <i class="bi bi-volume-mute-fill"></i>
              } @else {
                <i class="bi bi-volume-up-fill"></i>
              }
            </button>
          </div>
        </div>
        <audio
          #audioPlayer
          (timeupdate)="handleAudioPlayerTimeUpdate()"
          [src]="audioUrl"
          (ended)="handlePlayEnded()"
        ></audio>
      </div>

      <div class="modal-footer d-flex">
        <button
          type="button"
          class="btn btn-primary ms-auto"
          [disabled]="audioUrl.length == 0"
          (click)="handleRecordingDone()"
        >
          Done
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop fade show"></div>
