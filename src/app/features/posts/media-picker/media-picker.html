<div class="modal fade show d-block" tabindex="-1" role="dialog" id="mediaPicker">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header d-flex">
        <h5 class="modal-title">Select or Create Media</h5>

        <button
          type="button"
          class="btn-close ms-auto"
          aria-label="Close"
          (click)="handleCloseButtonClick()"
        ></button>
      </div>

      <div class="modal-body">
        <div class="d-flex gap-1">
          <div class="d-flex flex-column gap-1">
            <button
              type="button"
              class="btn border mt-auto w-100 media-option"
              (click)="handlePhotoButtonClick()"
            >
              <i class="bi bi-camera d-block"></i>Take <br />Photo
            </button>
            <button
              class="btn border media-option mt-auto w-100"
              (click)="handleVideoButtonClick()"
            >
              <i class="bi bi-camera-video d-block"></i>Record <br />Video
            </button>
            <button
              class="btn border media-option mt-auto w-100"
              (click)="handleAudioButtonClick()"
            >
              <i class="bi bi-mic d-block"></i>Record <br />Audio
            </button>
          </div>

          <button class="btn media-option ms-auto border w-100" (click)="handleFileButtonClick()">
            <i class="bi bi-images d-block"></i>Choose from Library
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop fade show"></div>
